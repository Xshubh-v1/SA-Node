*{box-sizing:border-box}
html,body{margin:0;height:100%;background:#050608;overflow:hidden;overscroll-behavior:none}
body{font-family:var(--font-body);color:#F3F4F6;-webkit-tap-highlight-color:transparent}
.font-display{font-family:var(--font-display)}
.font-condensed{font-family:var(--font-condensed);letter-spacing:.04em}
.font-body{font-family:var(--font-body)}
.font-mono{font-family:var(--font-mono)}

/* ---------- Layer 1: intro video ---------- */
#stage{position:fixed;inset:0;z-index:1;background:#000}
#intro{width:100%;height:100%;object-fit:contain;background:#000;display:block}

/* ---------- Layer 2: enter gate (old site look) ---------- */
#enter-gate{position:fixed;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;
  text-align:center;padding:env(safe-area-inset-top) 1.5rem env(safe-area-inset-bottom);
  background-color:#040507;
  background-image:radial-gradient(circle at 50% 40%,rgba(229,169,60,.2),transparent 70%),linear-gradient(rgba(4,5,7,.72),rgba(4,5,7,.92)),var(--first);
  background-size:cover;background-position:center}
.gate-label{font:400 11px/1.6 var(--font-mono);letter-spacing:.25em;text-transform:uppercase;color:var(--gold);max-width:21rem;text-wrap:balance}
.gate-title{margin:.75rem 0 0;font:800 3rem/1 var(--font-display);letter-spacing:-.025em;color:#fff}
.gate-date{margin-top:.75rem;font:400 .75rem/1rem var(--font-mono);letter-spacing:.25em;color:#a3a3a3}
.gate-hint{margin-top:1.5rem;font:400 10px/1.5 var(--font-mono);letter-spacing:.3em;text-transform:uppercase;color:#737373}
@media(min-width:640px){.gate-title{font-size:4.5rem}}

.enter-btn{position:relative;margin-top:2.5rem;padding:1rem 2.4rem;border-radius:999px;border:1px solid rgba(229,169,60,.7);
  background:rgba(229,169,60,.08);color:#fff;font:700 13px/1 Syne,sans-serif;letter-spacing:.3em;cursor:pointer;
  box-shadow:0 0 40px rgba(229,169,60,.2),inset 0 0 18px rgba(229,169,60,.08);-webkit-tap-highlight-color:transparent;touch-action:manipulation}
.enter-btn::before,.enter-btn::after{content:"";position:absolute;inset:-1px;border-radius:inherit;border:1px solid rgba(229,169,60,.6);
  pointer-events:none;animation:ripple 2.8s cubic-bezier(.2,.6,.3,1) infinite}
.enter-btn::after{animation-delay:1.4s}
.enter-btn:active{transform:scale(.97)}
.enter-btn:focus-visible{outline:2px solid #fff;outline-offset:5px}
@keyframes ripple{0%{transform:scale(1);opacity:.75}100%{transform:scale(1.4,1.85);opacity:0}}

/* ---------- Layer 3: black veil + error ---------- */
#veil{position:fixed;inset:0;z-index:5;background:#000;opacity:0;pointer-events:none;transition:opacity .7s ease}
#err{position:fixed;inset:0;z-index:6;display:flex;align-items:center;justify-content:center;padding:2rem;text-align:center;
  background:#000;color:var(--gold);font:400 1rem/1.6 var(--font-body)}
#err[hidden]{display:none}

@media (prefers-reduced-motion:reduce){.enter-btn::before,.enter-btn::after{animation-duration:6s}}
</style>
</head>
<body>

<div id="stage">
  <video id="intro" src="intro.mp4" playsinline webkit-playsinline preload="auto"
         disablepictureinpicture controlslist="nodownload noremoteplayback"></video>
</div>

<main id="enter-gate">
  <div class="gate-label">Enter into the magical world of Harry Potter</div>
  <h1 class="gate-title">TUSHTI</h1>
  <div class="gate-date">THE 18TH · 10.11.2026</div>
  <button id="enter-btn" class="enter-btn" type="button">TAP TO ENTER</button>
  <div class="gate-hint">Sound on · Full experience</div>
</main>

<div id="veil"></div>
<div id="err" hidden>Video load nahi hui.<br>intro.mp4 ko index.html ke same folder mein rakho.</div>

<script>
(() => {
  const gate = document.getElementById('enter-gate'),
        veil = document.getElementById('veil'),
        vid  = document.getElementById('intro'),
        btn  = document.getElementById('enter-btn'),
        err  = document.getElementById('err');
  let started = false;

  function fail() {
    gate.style.display = 'none';
    veil.style.opacity = 0;
    err.hidden = false;
  }

  function enter() {
    if (started) return;
    started = true;
    vid.muted = false;
    vid.volume = 1;
    // play() tap ke andar hi call hona chahiye, tabhi browser sound allow karta hai
    vid.play()
      .catch(() => { vid.muted = true; return vid.play(); })
      .catch(fail);
    veil.style.opacity = 1;                       // gate -> black fade
    setTimeout(() => {
      gate.style.display = 'none';
      veil.style.transition = 'opacity 1.4s ease';
      veil.style.opacity = 0;                     // black se video fade-in
    }, 750);
  }

  btn.addEventListener('click', enter);
  vid.addEventListener('error', () => { if (started) fail(); });

  /* video khatam: aakhri frame (envelope) screen par ruka rahega, yahin se agla step judega */
  vid.addEventListener('ended', () => {
    document.body.dataset.stage = 'envelope';
    // NEXT STEP: envelope open hone wala part yahin add hoga
  });
})();
</script>
</body>
</html>
